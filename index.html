<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPSC Bags</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #111;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .product {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .product img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
        }

        .product h2 {
            margin-top: 20px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>SPSC Bags</h1>
        <p>Quality Bags • Stylish • Affordable</p>
    </header>

    <div class="product">
        <img src="bag.jpeg" alt="SPSC Bag">

        <h2>SPSC Side Bag</h2>

        <p>A stylish and practical bag for everyday use.</p>

        <div class="price">
            Price: ৳ TBD
        </div>
    </div>

</body>
</html>
